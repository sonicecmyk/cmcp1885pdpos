<style>
:root{
  --bg:#f6f1e9;--card:#fffaf3;--text:#3b332c;--muted:#8a7f6f;--line:#e6dcc8;
  --primary:#3b332c;--accent:#b3623c;--accent2:#f3e3d3;--green:#6b7d4f;--red:#b3462f;
  --greenbg:#e3ead9;--greentext:#4b5d38;--heroFrom:#3b332c;--heroTo:#b3623c;
  --shadow:0 12px 32px rgba(59,51,44,.10);--radius:22px;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
button,input,select,textarea{font:inherit} button{cursor:pointer;border:0}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:96px}
header{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.92);backdrop-filter:blur(18px);padding:16px 18px 12px;border-bottom:1px solid rgba(229,231,235,.7)}
.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:22px}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:#fff;box-shadow:var(--shadow);font-size:20px}
main{padding:18px}
.page{display:none}.page.active{display:block}
.hero{background:linear-gradient(135deg,var(--heroFrom,#3b332c),var(--heroTo,#b3623c));color:#fff;border-radius:28px;padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;color:rgba(255,255,255,.85);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.stat b{font-size:25px;display:block}.stat span{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 6px 20px rgba(15,23,42,.04)}
.card h2,.card h3{margin:0 0 12px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.btn{padding:11px 15px;border-radius:14px;background:#eef2f7;color:var(--text);font-weight:700}.btn.primary{background:var(--primary);color:#fff}.btn.purple{background:var(--accent);color:#fff}.btn.green{background:var(--greenbg);color:var(--greentext)}.btn.red{background:#fee2e2;color:#991b1b}.btn.small{padding:8px 11px;font-size:12px}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 13px;outline:none}input:focus,select:focus,textarea:focus{border-color:#a78bfa;box-shadow:0 0 0 3px #ede9fe}
label{font-size:12px;font-weight:800;color:#475569;display:block;margin:10px 0 6px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
.searchbar{display:flex;gap:8px}.searchbar input{flex:1}.searchbar .btn{white-space:nowrap}
.result{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.result:last-child{border-bottom:0}
.cover{width:62px;height:86px;object-fit:cover;border-radius:9px;background:#e5e7eb;flex:none}.cover.big{width:90px;height:126px}
.meta{min-width:0;flex:1}.title{font-weight:900;line-height:1.35}.muted{color:var(--muted);font-size:12px;line-height:1.5}.tag{display:inline-block;background:#f1f5f9;border-radius:999px;padding:4px 8px;font-size:11px;margin:3px 3px 0 0}.tag.purple{background:var(--accent2);color:#5b21b6}.tag.green{background:var(--greenbg);color:var(--greentext)}
.volgrid{display:flex;flex-wrap:wrap;gap:8px}
.voltile{position:relative;min-width:46px;height:46px;padding:0 6px;border-radius:12px;background:#f1f5f9;color:#475569;font-weight:800;font-size:13px}
.voltile.owned{background:var(--greenbg);color:var(--greentext)}
.voltile.sell::after{content:'';position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.voltile.selected{outline:3px solid var(--accent);outline-offset:1px}
.ed-badge{position:absolute;bottom:2px;left:3px;font-size:9px;font-weight:800;background:#111827;color:#fff;border-radius:5px;padding:0 3px;line-height:1.4}
.op-badge{position:absolute;top:2px;left:3px;font-size:9px;font-weight:800;background:#57534e;color:#fff;border-radius:5px;padding:0 3px;line-height:1.4}
.shelfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.shelfcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer}
.shelfcard .cwrap{position:relative;width:100%;aspect-ratio:3/4;background:var(--accent2)}
.shelfcard .cwrap img{width:100%;height:100%;object-fit:cover;display:block}
.shelfcard .pctdot{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px}
.shelfcard .info{padding:8px 9px 10px}

.addnav{position:relative}.addnav .plus{position:absolute;left:50%;top:-30px;transform:translateX(-50%);width:62px;height:62px;border-radius:22px;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 14px 30px rgba(0,0,0,.28);border:5px solid var(--bg)}
.addnav em{font-style:normal;position:relative;top:27px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:50;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:28px 28px 0 0;max-height:92vh;overflow:auto;padding:18px 18px 30px}
.handle{width:42px;height:5px;background:#d1d5db;border-radius:9px;margin:0 auto 15px}

@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.sheet{border-radius:28px;margin-bottom:20px}.modal{align-items:center}.formgrid.three{grid-template-columns:repeat(3,1fr)}}

<body>
<div class="app">
<header>
  <div class="top">
    <div><div class="brand">我的收藏櫃</div></div>
    <button class="iconbtn" onclick="openShare()">⚙</button>
  </div>
</header>

<main>
<section id="home" class="page active">
  <div class="hero"><h1>記錄你每一個收藏</h1><p>搜尋書名／作者、掃 ISBN、記錄每一集的價格與收藏狀態。</p></div>
  <div class="grid">
    <div class="stat"><b id="sBooks">0</b><span>已收藏本數</span></div>
    <div class="stat"><b id="sSeries">0</b><span>收藏系列</span></div>
    <div class="stat"><b id="sSpend">$0</b><span>實際花費</span></div>
    <div class="stat"><b id="sWant">0</b><span>待購入</span></div>
  </div>
  <div class="card">
    <div class="row between"><h2>快速開始</h2><button class="btn purple" onclick="openEditor()">＋ 新增作品</button></div>
    <div class="row wrap">
      <button class="btn" onclick="go('want')">想買清單</button>
      <button class="btn" onclick="go('stats')">看作者統計</button>
    </div>
  </div>
  <div class="card"><h2>收藏進度</h2><div id="homeSeries" class="list"></div></div>
</section>

<section id="books" class="page">
  <div class="row between"><div><h2>我的收藏</h2><div class="muted">依作品分組顯示，點一下看每一項的價格與狀態。</div></div></div>
  <div class="card">
    <div class="searchbar"><input id="localSearch" placeholder="搜尋：書名／作者品牌／ISBN" oninput="renderBooks()"><button class="btn" onclick="renderBooks()">搜尋</button></div>
    <div class="formgrid" style="margin-top:10px">
      <div><label>類型</label><select id="bookType" onchange="renderBooks()"><option value="all">全部類型</option><option value="書籍">書籍</option><option value="專輯與周邊">專輯與周邊</option><option value="IP公仔／娃娃">IP公仔／娃娃</option><option value="其他收藏">其他收藏</option></select></div>
      <div><label>篩選</label><select id="bookFilter" onchange="renderBooks()"><option value="all">全部</option><option value="owned">已收藏</option><option value="unowned">待購入</option><option value="sell">待出售</option><option value="ongoing">連載中（要追新集）</option><option value="oop">已絕版</option></select></div>
      <div><label>排序</label><select id="bookSort" onchange="renderBooks()"><option value="default">新增順序</option><option value="dateDesc">購入日期：新到舊</option><option value="dateAsc">購入日期：舊到新</option><option value="priceDesc">價格：高到低</option><option value="priceAsc">價格：低到高</option><option value="unownedFirst">未收藏優先</option></select></div>
    </div>
  </div>
  <div id="bookList" class="shelfgrid"></div>
</section>

<section id="want" class="page">
  <div class="card"><h2>想買／待補集數</h2><div class="muted">可以把缺的單集留在這裡，之後一鍵轉成已購入。</div><div id="wantBudget" class="muted" style="margin-top:6px;font-weight:800"></div></div>
  <div id="wantList" class="list"></div>
</section>

<section id="stats" class="page">
  <div class="card"><h2>收藏統計</h2><div id="statsSummary"></div></div>
  <div class="card"><h3>作者</h3><div id="authorStats"></div></div>
  <div class="card"><h3>分類／類型</h3><div id="catStats"></div></div>
</section>
</main>

<nav class="bottom">
  <button class="nav active" data-page="home" onclick="go('home')"><span>⌂</span>首頁</button>
  <button class="nav" data-page="books" onclick="go('books')"><span>▣</span>收藏櫃</button>
  <button class="nav addnav" onclick="openEditor()"><div class="plus">＋</div><em>新增</em></button>
  <button class="nav" data-page="want" onclick="go('want')"><span>♡</span>想買</button>
  <button class="nav" data-page="stats" onclick="go('stats')"><span>◔</span>統計</button>
</nav>
</div>

<div id="modal" class="modal"><div class="sheet" style="position:relative">
  <button class="iconbtn" style="position:absolute;top:14px;right:14px;width:34px;height:34px;font-size:15px;z-index:5" onclick="confirmCloseModal()">✕</button>
  <div class="handle"></div><div id="modalBody"></div>
</div></div>
<div id="toast" class="toast"></div>
<input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(this)">

<script>
const KEY='paperBooksV2';
function uid(){return (crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2))}
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
  series:[]
};
db.settings=db.settings||{theme:'侘寂日系'};
db.suggest=db.suggest||{};
const THEMES={
 '侘寂日系':{bg:'#f6f1e9',card:'#fffaf3',text:'#3b332c',muted:'#8a7f6f',line:'#e6dcc8',primary:'#3b332c',accent:'#b3623c',accent2:'#f3e3d3',green:'#6b7d4f',red:'#b3462f',greenbg:'#e3ead9',greentext:'#4b5d38',heroFrom:'#3b332c',heroTo:'#b3623c'},
 '薄荷清新':{bg:'#f1f8f6',card:'#ffffff',text:'#1f2d28',muted:'#6b8079',line:'#dcece6',primary:'#1f2d28',accent:'#2f9e78',accent2:'#dff3ea',green:'#2f9e78',red:'#d15b4f',greenbg:'#dff3ea',greentext:'#1f6b4f',heroFrom:'#1f2d28',heroTo:'#2f9e78'},
 '櫻花粉':{bg:'#fdf3f6',card:'#ffffff',text:'#3d2b30',muted:'#9c7f88',line:'#f5dee5',primary:'#3d2b30',accent:'#e37fa0',accent2:'#fbe4ec',green:'#7a9b6b',red:'#d1495b',greenbg:'#eaf1e3',greentext:'#4f6b43',heroFrom:'#3d2b30',heroTo:'#e37fa0'},
 '深夜藍':{bg:'#12141c',card:'#1b1f2c',text:'#eef1f8',muted:'#8891a8',line:'#2a2f42',primary:'#eef1f8',accent:'#7c9bff',accent2:'#26304d',green:'#4ade80',red:'#f87171',greenbg:'#1c3326',greentext:'#7fe3ab',heroFrom:'#1b1f2c',heroTo:'#3c4a8f'},
 '經典紫':{bg:'#f5f7fb',card:'#ffffff',text:'#172033',muted:'#6b7280',line:'#e5e7eb',primary:'#111827',accent:'#7c3aed',accent2:'#ede9fe',green:'#15803d',red:'#dc2626',greenbg:'#dcfce7',greentext:'#166534',heroFrom:'#111827',heroTo:'#312e81'}
};
function applyTheme(name){
 let t=THEMES[name]||THEMES['侘寂日系'];
 let root=document.documentElement.style;
 Object.entries(t).forEach(([k,v])=>root.setProperty('--'+k,v));
 let m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t.primary)
}
applyTheme(db.settings.theme);
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function langSelectHtml(id,current){
 let known=['繁體中文','簡體中文','日文','英文','韓文'];
 let val=current&&known.includes(current)?current:(current?'其他':'繁體中文');
 let otherVal=(current&&!known.includes(current))?current:'';
 return `<select id="${id}" onchange="document.getElementById('${id}Other').style.display=this.value==='其他'?'block':'none'">${[...known,'其他'].map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select><input id="${id}Other" placeholder="請輸入語言" value="${esc(otherVal)}" style="margin-top:6px;display:${val==='其他'?'block':'none'}">`
}
function readLang(id){let sel=document.getElementById(id).value;return sel==='其他'?(document.getElementById(id+'Other').value.trim()||'其他'):sel}
function editionSelectHtml(id,current){
 let known=['一般版','特裝版','簽名版','限定版'];
 let val=current&&known.includes(current)?current:(current?'其他':'一般版');
 let otherVal=(current&&!known.includes(current))?current:'';
 return `<select id="${id}" onchange="document.getElementById('${id}Other').style.display=this.value==='其他'?'block':'none'">${[...known,'其他'].map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select><input id="${id}Other" placeholder="請輸入版本" value="${esc(otherVal)}" style="margin-top:6px;display:${val==='其他'?'block':'none'}">`
}
function readEdition(id){let sel=document.getElementById(id).value;return sel==='其他'?(document.getElementById(id+'Other').value.trim()||'其他'):sel}
const COLLECTION_TYPES=['書籍','專輯與周邊','IP公仔／娃娃','其他收藏'];
const CATEGORY_PRESETS={
 '書籍':['漫畫','小說','輕小說','工具書','雜誌','寫真集','畫冊'],
 '專輯與周邊':['專輯','海報','吊飾','珍藏卡','應援小物','服飾'],
 'IP公仔／娃娃':['公仔','黏土人','景品／Scale Figure','絨毛娃娃','吊飾'],
 '其他收藏':[]
};
const TYPE_FORM_CONFIG={
 '書籍':{authorLabel:'作者',authorField:'author',showItemKind:false,showISBN:true,showPages:true,showStatus:true,publisherLabel:'出版社',dateLabel:'出版日'},
 '專輯與周邊':{authorLabel:'歌手／團體',authorField:'artist',showItemKind:true,itemKindLabel:'周邊品項',itemKindPlaceholder:'例如：手燈、毛巾、小卡',itemKindField:'merch',showISBN:false,showPages:false,showStatus:false,publisherLabel:'發行／廠商',dateLabel:'發售日'},
 'IP公仔／娃娃':{authorLabel:'IP名稱',authorField:'ip',showItemKind:true,itemKindLabel:'系列／波次',itemKindPlaceholder:'例如：麻糬系列、機場限定',itemKindField:'wave',showISBN:false,showPages:false,showStatus:false,publisherLabel:'廠商',dateLabel:'發售日'},
 '其他收藏':{authorLabel:'作者／品牌',authorField:'other',showItemKind:true,itemKindLabel:'項目類型',itemKindPlaceholder:'',itemKindField:'itemtype',showISBN:false,showPages:false,showStatus:true,publisherLabel:'廠商',dateLabel:'日期'}
};
function updateFormForType(prefix,type){
 let cfg=TYPE_FORM_CONFIG[type]||TYPE_FORM_CONFIG['書籍'];
 let setLabel=(wrapId,text)=>{let el=document.querySelector(`#${prefix}${wrapId} > label`);if(el)el.textContent=text};
 let setShow=(wrapId,show)=>{let el=document.getElementById(prefix+wrapId);if(el)el.style.display=show?'':'none'};
 setLabel('AuthorWrap',cfg.authorLabel);
 setShow('ItemKindWrap',!!cfg.showItemKind);
 if(cfg.showItemKind){
  setLabel('ItemKindWrap',cfg.itemKindLabel);
  let inp=document.getElementById(prefix+'ItemKind');if(inp)inp.placeholder=cfg.itemKindPlaceholder||'';
  let sc=document.getElementById(prefix+'ItemKindSuggest');if(sc)sc.innerHTML=suggestChipsHtml(type,cfg.itemKindField,prefix+'ItemKind',false)
 }
 setShow('ISBN13Wrap',cfg.showISBN);setShow('ISBN10Wrap',cfg.showISBN);
 setShow('PagesWrap',cfg.showPages);
 setShow('StatusWrap',cfg.showStatus);
 setLabel('PublisherWrap',cfg.publisherLabel);
 setLabel('DateWrap',cfg.dateLabel);
 let cw=document.getElementById(prefix+'CatWrap');if(cw)cw.innerHTML=categorySelectHtml(prefix+'Cat',type,'');
 let asug=document.getElementById(prefix+'AuthorSuggest');if(asug)asug.innerHTML=suggestChipsHtml(type,cfg.authorField,prefix+'Author',true)
}
function typeSelectHtml(id,current,onchangeExtra){
 let val=COLLECTION_TYPES.includes(current)?current:'書籍';
 return `<select id="${id}" onchange="${onchangeExtra||''}">${COLLECTION_TYPES.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select>`
}
function categorySelectHtml(id,type,current){
 let known=CATEGORY_PRESETS[type]||[];
 let val=current&&known.includes(current)?current:(current?'其他':(known[0]||'其他'));
 let otherVal=(current&&!known.includes(current))?current:'';
 let opts=[...known,'其他'];
 return `<select id="${id}" onchange="document.getElementById('${id}Other').style.display=this.value==='其他'?'block':'none'">${opts.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select><input id="${id}Other" placeholder="請輸入分類" value="${esc(otherVal)}" style="margin-top:6px;display:${val==='其他'?'block':'none'}">`
}
function readCategory(id){let sel=document.getElementById(id).value;return sel==='其他'?(document.getElementById(id+'Other').value.trim()||'其他'):sel}
function bumpSuggest(type,field,val){
 val=(val||'').trim();if(!val)return;
 db.suggest[type]=db.suggest[type]||{};
 db.suggest[type][field]=db.suggest[type][field]||{};
 db.suggest[type][field][val]=(db.suggest[type][field][val]||0)+1
}
function topSuggest(type,field,n=6){
 let m=(db.suggest[type]||{})[field]||{};
 return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>x[0])
}
function suggestChipsHtml(type,field,targetInputId,multi){
 let vals=topSuggest(type,field);
 if(!vals.length)return '';
 return `<div class="suggest-chips">${vals.map(v=>`<button type="button" class="suggest-chip" onclick='applySuggest("${targetInputId}",${JSON.stringify(v)},${!!multi})'>${esc(v)}</button>`).join('')}</div>`
}
function applySuggest(inputId,val,multi){
 let el=document.getElementById(inputId);if(!el)return;
 if(multi){
  let cur=el.value.split(/[,、]/).map(x=>x.trim()).filter(Boolean);
  if(!cur.includes(val))cur.push(val);
  el.value=cur.join('、')
 } else { el.value=val }
}
function parseVolumeTokens(input){
 let out=[];
 (input||'').split(/[,，、]/).map(t=>t.trim()).filter(Boolean).forEach(t=>{
  let m=t.match(/^(\d+)\s*[-~到至]\s*(\d+)$/);
  if(m){
   let a=parseInt(m[1],10),b=parseInt(m[2],10);
   if(!isNaN(a)&&!isNaN(b)&&a<=b&&(b-a)<=300){for(let i=a;i<=b;i++)out.push(String(i))}
   else out.push(t)
  } else out.push(t)
 });
 return out.length?out:['']
}
function money(v){if(v===null||v===undefined||v==='')return '—';return '$'+Number(v).toLocaleString('zh-TW',{maximumFractionDigits:2})}
function resizeImageFile(file,maxW=500,quality=0.82){
 return new Promise((resolve,reject)=>{
  let reader=new FileReader();
  reader.onload=e=>{
   let img=new Image();
   img.onload=()=>{
    let scale=Math.min(1,maxW/img.width);
    let w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
    let canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    resolve(canvas.toDataURL('image/jpeg',quality))
   };
   img.onerror=()=>reject(new Error('圖片讀取失敗'));
   img.src=e.target.result
  };
  reader.onerror=()=>reject(new Error('圖片讀取失敗'));
  reader.readAsDataURL(file)
 })
}
async function handleCoverFile(inputEl,targetId){
 let f=inputEl.files&&inputEl.files[0];if(!f)return;
 try{let dataUrl=await resizeImageFile(f);document.getElementById(targetId).value=dataUrl;toast('封面已更新（來自相簿）')}
 catch(e){toast('圖片讀取失敗，請改用網址')}
 finally{inputEl.value=''}
}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));renderAll()}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function confirmCloseModal(){
 let body=document.getElementById('modalBody');
 let hasInput=Array.from(body.querySelectorAll('input[type="text"],input:not([type]),input[type="number"],input[type="date"],textarea')).some(el=>el.value && String(el.value).trim()!=='');
 if(hasInput && !confirm('要放棄目前輸入的內容嗎？'))return;
 closeModal()
}
function showModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')}

function renderAll(){renderHome();renderBooks();renderWant();renderStats()}
function renderHome(){
 let vols=db.series.flatMap(s=>s.volumes||[]), owned=vols.filter(v=>v.owned), spend=owned.reduce((a,v)=>a+Number(v.purchasePrice||0),0);
 document.getElementById('sBooks').textContent=owned.length;
 document.getElementById('sSeries').textContent=db.series.length;
 document.getElementById('sSpend').textContent=money(spend);
 document.getElementById('sWant').textContent=vols.filter(v=>!v.owned).length;
 document.getElementById('homeSeries').innerHTML=db.series.length?db.series.map(s=>{
   let o=(s.volumes||[]).filter(v=>v.owned).length,total=(s.volumes||[]).length,pct=total?Math.round(o/total*100):0;
   return `<div class="bookrow" onclick="openSeries('${s.id}')"><img class="cover" src="${esc(s.cover||'')}" onerror="this.style.visibility='hidden'"><div class="meta"><div class="title">${esc(s.title)}</div><div class="muted">${esc((s.authors||[]).join('、'))} · ${o}/${total} 本</div><div class="progress"><i style="width:${pct}%"></i></div></div><b>${pct}%</b></div>`
 }).join(''):'<div class="empty">還沒有收藏。按底部中央「＋ 新增」開始吧。</div>'
}
function renderBooks(){
 let q=(document.getElementById('localSearch')?.value||'').toLowerCase();
 let typeFilter=document.getElementById('bookType')?.value||'all';
 let filter=document.getElementById('bookFilter')?.value||'all';
 let sortBy=document.getElementById('bookSort')?.value||'default';
 let rows=db.series.filter(s=>{
  if(typeFilter!=='all' && (s.type||'書籍')!==typeFilter)return false;
  if(q){
   let hitSeries=[s.title,...(s.authors||[])].join(' ').toLowerCase().includes(q);
   let hitVol=(s.volumes||[]).some(v=>[v.title,v.isbn13,v.isbn10].join(' ').toLowerCase().includes(q));
   if(!hitSeries && !hitVol)return false
  }
  if(filter==='owned')return (s.volumes||[]).some(v=>v.owned);
  if(filter==='unowned')return (s.volumes||[]).some(v=>!v.owned);
  if(filter==='sell')return (s.volumes||[]).some(v=>v.sell);
  if(filter==='ongoing')return s.status==='連載中';
  if(filter==='oop')return (s.volumes||[]).some(v=>v.outOfPrint);
  return true
 });
 let spendOf=s=>(s.volumes||[]).reduce((a,v)=>a+Number(v.purchasePrice||v.listPrice||0),0);
 let lastDateOf=s=>(s.volumes||[]).map(v=>v.purchaseDate||'').sort().slice(-1)[0]||'';
 let ratioOf=s=>{let t=(s.volumes||[]).length,o=(s.volumes||[]).filter(v=>v.owned).length;return t?o/t:1};
 if(sortBy==='dateDesc')rows.sort((a,b)=>lastDateOf(b).localeCompare(lastDateOf(a)));
 else if(sortBy==='dateAsc')rows.sort((a,b)=>lastDateOf(a).localeCompare(lastDateOf(b)));
 else if(sortBy==='priceDesc')rows.sort((a,b)=>spendOf(b)-spendOf(a));
 else if(sortBy==='priceAsc')rows.sort((a,b)=>spendOf(a)-spendOf(b));
 else if(sortBy==='unownedFirst')rows.sort((a,b)=>ratioOf(a)-ratioOf(b));

  let total=(s.volumes||[]).length,owned=(s.volumes||[]).filter(v=>v.owned).length,pct=total?Math.round(owned/total*100):0;

 if(!s.title){toast('請輸入作品名稱');return}
 let tokens=parseVolumeTokens(document.getElementById('fVol').value.trim()||'1');
 let owned=document.getElementById('fOwned').checked,sell=document.getElementById('fSell').checked,outOfPrint=document.getElementById('fOOP').checked,today=new Date().toISOString().slice(0,10);

 });

<button class="btn red" style="width:100%;margin-top:8px" onclick="deleteVolume('${sid}','${vid}')">刪除這一集</button>`) }
function saveEdit(sid,vid){
 let s=db.series.find(x=>x.id===sid),v=s.volumes.find(v=>v.id===vid);
 let cfg=TYPE_FORM_CONFIG[s.type]||TYPE_FORM_CONFIG['書籍'];
 v.volumeNo=document.getElementById('evNo').value.trim();
 v.isbn13=(document.getElementById('evISBN')?.value||'').trim();
 v.publishedDate=document.getElementById('evDate2').value.trim();
 v.listPrice=document.getElementById('evList').value;v.purchasePrice=document.getElementById('evBuy').value;v.discount=document.getElementById('evDisc').value;
 v.edition=readEdition('evEdition');
 v.itemKind=(document.getElementById('evItemKind')?.value||'').trim();
 v.region=(document.getElementById('evRegion')?.value||'').trim();
 let wasOwned=v.owned;v.owned=document.getElementById('evOwned').checked;v.purchaseDate=document.getElementById('evDate').value||(v.owned&&!wasOwned?new Date().toISOString().slice(0,10):v.purchaseDate);
 v.priority=document.getElementById('evPriority').value;v.notes=document.getElementById('evNotes').value.trim();v.sell=document.getElementById('evSell').checked;v.outOfPrint=document.getElementById('evOOP').checked;
 if(v.itemKind)bumpSuggest(s.type,cfg.itemKindField,v.itemKind);
 save();openSeries(sid)}
function buyVolume(sid,vid){let v=db.series.find(s=>s.id===sid).volumes.find(v=>v.id===vid);v.owned=true;showModal(`<h2>記錄購入價格</h2><label>實際購入價（可輸入小數）</label><input id="quickBuy" type="number" step="0.01" placeholder="例如 25.5"><label>折扣</label><input id="quickDisc" type="number" step="0.01"><button class="btn purple" style="width:100%;margin-top:12px" onclick="finishBuy('${sid}','${vid}')">完成</button>`)}
function finishBuy(sid,vid){let v=db.series.find(s=>s.id===sid).volumes.find(v=>v.id===vid);v.purchasePrice=document.getElementById('quickBuy').value;v.discount=document.getElementById('quickDisc').value;v.purchaseDate=new Date().toISOString().slice(0,10);save();closeModal();toast('已更新購入紀錄')}
function deleteVolume(sid,vid){if(!confirm('確定刪除這一集？'))return;let s=db.series.find(x=>x.id===sid);s.volumes=s.volumes.filter(v=>v.id!==vid);if(!s.volumes.length){db.series=db.series.filter(x=>x.id!==sid);save();closeModal()}else{save();openSeries(sid)}}
function deleteSeries(sid){if(!confirm('確定要刪除整個作品（含所有集數）嗎？此動作無法復原。'))return;db.series=db.series.filter(x=>x.id!==sid);save();closeModal();toast('已刪除作品')}

 showModal(`<h2>編輯作品資訊</h2><div class="formgrid">

 <div><label>收藏類型</label>${typeSelectHtml('esType',curType,"updateFormForType('es',this.value)")}</div>

 <div id="esPublisherWrap"><label>${esc(cfg.publisherLabel)}</label><input id="esPublisher" value="${esc(s.publisher||'')}"></div>
 <div><label>語言</label>${langSelectHtml('esLang',s.language||'')}</div>
 <div><label>分類</label><div id="esCatWrap">${categorySelectHtml('esCat',curType,s.category||'')}</div></div>
 <div id="esStatusWrap"><label>連載狀態</label><select id="esStatus"><option value="未知" ${!s.status||s.status==='未知'?'selected':''}>未知</option><option value="連載中" ${s.status==='連載中'?'selected':''}>連載中（還會繼續出）</option><option value="已完結" ${s.status==='已完結'?'selected':''}>已完結（不用再追）</option></select></div>
 <div class="full"><label>封面 URL 或從相簿上傳</label><input id="esCover" value="${esc(s.cover||'')}">
 <input type="file" accept="image/*" style="margin-top:8px" onchange="handleCoverFile(this,'esCover')"></div>
 </div>
 <button class="btn purple" style="width:100%;margin-top:12px" onclick="saveSeriesInfo('${sid}')">儲存</button>
 <button class="btn red" style="width:100%;margin-top:8px" onclick="deleteSeries('${sid}')">刪除整個作品</button>`)

function saveSeriesInfo(sid){
 let s=db.series.find(x=>x.id===sid);if(!s)return;
 let type=document.getElementById('esType').value;
 let cfg=TYPE_FORM_CONFIG[type]||TYPE_FORM_CONFIG['書籍'];
 s.title=document.getElementById('esTitle').value.trim()||s.title;
 s.type=type;
 s.authors=document.getElementById('esAuthor').value.split(/[,、]/).map(x=>x.trim()).filter(Boolean);
 s.publisher=document.getElementById('esPublisher').value.trim();
 s.language=readLang('esLang');
 s.category=readCategory('esCat');
 s.status=document.getElementById('esStatus').value;
 s.cover=document.getElementById('esCover').value.trim();
 s.authors.forEach(a=>bumpSuggest(type,cfg.authorField,a));
 save();openSeries(sid)
}
function openShare(){
 let names=Object.keys(THEMES),cur=db.settings.theme;
 showModal(`<h2>設定</h2>
<h3>外觀主題</h3>
<div class="row wrap" style="margin-bottom:16px">${names.map(n=>`<button class="btn ${n===cur?'purple':''}" onclick="chooseTheme('${n}')">${esc(n)}</button>`).join('')}</div>
<hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
<h3>備份與還原</h3><div class="muted" style="margin-bottom:10px">資料只存在這台裝置的瀏覽器裡，建議定期匯出備份。</div>
<div class="row wrap"><button class="btn" onclick="exportData()">⬇︎ 匯出備份 JSON</button><button class="btn" onclick="document.getElementById('importFile').click()">⬆︎ 匯入備份 JSON</button></div>`)
}
function chooseTheme(name){db.settings.theme=name;save();applyTheme(name);openShare()}
function loadImageSafe(src){
 return new Promise((resolve,reject)=>{
  if(!src){reject(new Error('no src'));return}
  let img=new Image();
  if(!src.startsWith('data:'))img.crossOrigin='anonymous';
  img.onload=()=>resolve(img);
  img.onerror=()=>reject(new Error('封面載入失敗'));
  img.src=src
 })
}
function roundRectPath(ctx,x,y,w,h,r){
 ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()
}
function drawCoverContain(ctx,img,x,y,w,h){
 let ir=img.width/img.height,br=w/h,dw,dh,dx,dy;
 if(ir>br){dh=h;dw=h*ir;dx=x-(dw-w)/2;dy=y}else{dw=w;dh=w/ir;dx=x;dy=y-(dh-h)/2}
 ctx.drawImage(img,dx,dy,dw,dh)
}
function wrapCJKText(ctx,text,x,y,maxWidth,lineHeight,maxLines,align){
 let line='',lines=[];
 for(let ch of String(text||'')){
  let test=line+ch;
  if(ctx.measureText(test).width>maxWidth && line){lines.push(line);line=ch}else{line=test}
  if(lines.length>=maxLines)break
 }
 if(line && lines.length<maxLines)lines.push(line);
 if(lines.length===maxLines){let last=lines[maxLines-1];if(ctx.measureText(last+'…').width>maxWidth)last=last.slice(0,-1);lines[maxLines-1]=last+(String(text||'').length>lines.join('').length?'…':'')}
 lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));
 return lines.length
}
async function drawShareCard(canvas,s,ratio){
 let w=ratio==='16:9'?1200:675, h=ratio==='16:9'?675:1200;
 canvas.width=w;canvas.height=h;
 let ctx=canvas.getContext('2d');
 let cs=getComputedStyle(document.documentElement);
 let bg=(cs.getPropertyValue('--bg')||'#f6f1e9').trim();
 let accent=(cs.getPropertyValue('--accent')||'#b3623c').trim();
 let accent2=(cs.getPropertyValue('--accent2')||'#f3e3d3').trim();
 let text=(cs.getPropertyValue('--text')||'#3b332c').trim();
 let cardbg=(cs.getPropertyValue('--card')||'#fffaf3').trim();
 let grad=ctx.createLinearGradient(0,0,w,h);grad.addColorStop(0,accent2);grad.addColorStop(1,bg);
 ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
 let total=(s.volumes||[]).length,owned=(s.volumes||[]).filter(v=>v.owned).length,pct=total?Math.round(owned/total*100):0;
 let pad=w*0.07,landscape=ratio==='16:9';
 let coverOk=false,img=null;
 if(s.cover){try{img=await loadImageSafe(s.cover);coverOk=true}catch(e){coverOk=false}}
 let font=w=>`-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif`;
 let textX,textY,textW,textH;
 if(landscape){
  let coverW=h-pad*2,coverX=pad,coverY=pad;
  ctx.save();roundRectPath(ctx,coverX,coverY,coverW,coverW,28);ctx.clip();
  if(coverOk){drawCoverContain(ctx,img,coverX,coverY,coverW,coverW)}
  else{ctx.fillStyle=cardbg;ctx.fillRect(coverX,coverY,coverW,coverW);ctx.fillStyle=accent;ctx.font=`900 ${coverW*0.32}px ${font()}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText((s.title||'?').slice(0,1),coverX+coverW/2,coverY+coverW/2)}
  ctx.restore();
  textX=coverX+coverW+pad*0.9;textY=pad;textW=w-textX-pad;textH=h-pad*2
 } else {
  let coverH=w*0.62-pad,coverX=pad,coverY=pad,coverW=w-pad*2;
  ctx.save();roundRectPath(ctx,coverX,coverY,coverW,coverH,28);ctx.clip();
  if(coverOk){drawCoverContain(ctx,img,coverX,coverY,coverW,coverH)}
  else{ctx.fillStyle=cardbg;ctx.fillRect(coverX,coverY,coverW,coverH);ctx.fillStyle=accent;ctx.font=`900 ${coverH*0.32}px ${font()}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText((s.title||'?').slice(0,1),coverX+coverW/2,coverY+coverH/2)}
  ctx.restore();
  textX=pad;textY=coverY+coverH+pad*0.9;textW=w-pad*2;textH=h-textY-pad
 }
 ctx.textAlign=landscape?'left':'center';ctx.textBaseline='top';
 let cx=landscape?textX:textX+textW/2;
 let titleSize=textW*(landscape?0.1:0.09);
 ctx.font=`900 ${titleSize}px ${font()}`;ctx.fillStyle=text;
 let linesUsed=wrapCJKText(ctx,s.title||'未命名作品',cx,textY,textW,titleSize*1.25,2,landscape?'left':'center');
 let curY=textY+linesUsed*titleSize*1.25+titleSize*0.35;
 if((s.authors||[]).length){
  ctx.font=`600 ${textW*0.05}px ${font()}`;ctx.globalAlpha=.72;
  ctx.fillText((s.authors||[]).join('、'),cx,curY);ctx.globalAlpha=1;
  curY+=textW*0.05*1.7
 }
 curY+=textW*0.03;
 ctx.font=`900 ${textW*0.17}px ${font()}`;ctx.fillStyle=accent;
 ctx.fillText(pct+'%',cx,curY);
 curY+=textW*0.17*1.05;
 ctx.font=`700 ${textW*0.05}px ${font()}`;ctx.fillStyle=text;ctx.globalAlpha=.82;
 ctx.fillText(`已收藏 ${owned}/${total}`,cx,curY);ctx.globalAlpha=1;
 curY+=textW*0.05*1.7;
 if(s.status && s.status!=='未知'){
  ctx.font=`700 ${textW*0.042}px ${font()}`;ctx.fillStyle=accent;
  ctx.fillText(s.status,cx,curY)
 }
 ctx.fillStyle=text;ctx.globalAlpha=.5;ctx.font=`700 ${w*0.022}px ${font()}`;ctx.textAlign='right';ctx.textBaseline='alphabetic';
 ctx.fillText('我的收藏櫃',w-pad*0.6,h-pad*0.35);ctx.globalAlpha=1;
 return coverOk
}
function openShareCard(sid){
 let s=db.series.find(x=>x.id===sid);if(!s)return;
 showModal(`<h2>分享圖卡</h2>
<div class="notice">產生一張可以下載、分享到限時動態或社群的收藏卡圖片。如果封面是從其他網站貼網址進來的，因為瀏覽器安全限制，有時候沒辦法把封面一起放進圖片裡，屆時會自動改用純文字版本，資料本身不受影響。</div>
<div class="row wrap" style="margin:10px 0"><button class="btn small purple" onclick="renderShareCardPreview('${sid}','16:9')">橫式 16:9</button><button class="btn small" onclick="renderShareCardPreview('${sid}','9:16')">直式 9:16（限動）</button></div>
<div style="display:flex;justify-content:center;background:var(--accent2);border-radius:16px;padding:12px"><canvas id="shareCanvas" style="max-width:100%;height:auto;border-radius:12px"></canvas></div>
<button class="btn purple" style="width:100%;margin-top:12px" onclick="downloadShareCard('${esc(s.title).replace(/'/g,"\\'")}')">下載圖片</button>`)
 renderShareCardPreview(sid,'16:9')
}
async function renderShareCardPreview(sid,ratio){
 let s=db.series.find(x=>x.id===sid);if(!s)return;
 let canvas=document.getElementById('shareCanvas');if(!canvas)return;
 let ok=await drawShareCard(canvas,s,ratio);
 if(!ok && s.cover)toast('封面圖片無法放入（外部網站限制），已改用純文字版本')
}
function downloadShareCard(title){
 let canvas=document.getElementById('shareCanvas');if(!canvas)return;
 canvas.toBlob(blob=>{
  if(!blob){toast('產生圖片失敗');return}
  let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${title||'收藏卡'}.png`;a.click()
 },'image/png')
}
function importData(inputEl){
 let f=inputEl.files&&inputEl.files[0];if(!f)return;
 let reader=new FileReader();
 reader.onload=e=>{
  try{
   let data=JSON.parse(e.target.result);
   if(!data||!Array.isArray(data.series))throw new Error('格式錯誤');
   if(!confirm(`確定要匯入嗎？將合併 ${data.series.length} 筆作品到目前的書櫃（不會刪除現有資料，重複的 id 會略過）。`))return;
   let existingIds=new Set(db.series.map(s=>s.id)),added=0;
   data.series.forEach(s=>{if(!existingIds.has(s.id)){db.series.push(s);added++}});
   save();toast(`已匯入 ${added} 筆作品`);closeModal()
  }catch(err){toast('匯入失敗，請確認是本 App 匯出的備份檔')}
 };
 reader.readAsText(f);
 inputEl.value=''
}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='我的紙本書櫃_backup.json';a.click()}
renderAll();
</script>
